android.nonTransitiveRClass=false
android.useAndroidX=true

kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2

org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -Dcom.android.tools.r8.emitKotlinMetadata=false -Dcom.android.tools.r8.disableKotlinMetadataVerification=true -Dcom.android.tools.r8.experimental.enableKotlinMetadataDesugaring=false
org.gradle.parallel=true

kotlin.daemon.jvmargs=-Xmx4g -Xms1g -XX:+UseParallelGC
